name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - '**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Page images come out of the generator around 1 MB each. Pillow re-encodes
      # them so the runner produces the same bytes a Mac does.
      - name: Install Pillow
        run: pip install --quiet --disable-pip-version-check Pillow

      # comics_generated/ holds the sources: page images plus a story.json each.
      # This writes comic-site/, which the next step copies to _site/comics.
      - name: Build the comics section
        run: python3 tools/build_comics.py

      # Assemble an explicit publish directory. Deploying the repo root would
      # upload everything present, including files that belong in version
      # control but must never be public (schema.sql, README.md, and any
      # untracked local file such as CLAUDE.md or rules/). Listing the site's
      # files here means a new internal file is private by default: it reaches
      # the public site only if someone adds it to this list on purpose.
      - name: Assemble publish directory
        run: |
          set -euo pipefail
          mkdir -p _site
          # index-v2.html is tracked only on the v2-draft branch, so it ships to
          # that preview and is simply skipped on main.
          for f in guide.html guide-zh.html reference.html reference-zh.html blog.html index-v2.html 404.html og-image.png og-en-c0ba4f60.png og-zh-ef381c66.png og-en-10704945.png og-zh-e3dad998.png og-en-0293ba50.png og-zh-875de84b.png og-en-972eb051.png og-zh-129a2494.png og-en-fdb5bbc4.png og-zh-f166e6fa.png favicon.ico favicon-192.png favicon-512.png apple-touch-icon.png og-en-93295211.png og-zh-35fd3c3a.png robots.txt sitemap.xml _redirects 093566f72edfb4fd08d60739fb3d790e.txt; do
            [ -f "$f" ] && cp "$f" _site/ || echo "skip missing $f"
          done
          # The comic deck is the home page (since 2026-09-29). index.html and
          # index-zh.html in the repo are the long page's source; it is published
          # as guide.html / guide-zh.html, which tools/build_deck.py writes.
          cp deck.html _site/index.html
          cp deck-zh.html _site/index-zh.html
          [ -d functions ] && cp -R functions _site/functions
          # Kenji's faces for the slide deck (deck.html, deck-zh.html).
          [ -d deck-img ] && cp -R deck-img _site/deck-img
          if [ -d comic-site ]; then cp -R comic-site _site/comics; fi
          # Blog essays: copy built article pages from blog/ to _site/blog/
          mkdir -p _site/blog
          for f in blog/a01.html blog/a02.html blog/a03.html blog/a04.html blog/a05.html blog/a06.html blog/a07.html blog/a08.html blog/a09.html blog/a10.html blog/a11.html blog/a12.html blog/a13.html; do
            [ -f "$f" ] && cp "$f" _site/blog/ || echo "skip missing $f"
          done
          # game2/ was THE WISH's first home. The game now lives at game.safeagi.ca
          # (the AI-Safety-Game repo); /game2 redirects there via _redirects, so
          # the folder is kept for history and no longer published.
          echo "--- publishing ---"
          find _site -type f | sort

      # Stamp freshness dates at deploy time so they can never go stale.
      # Applied to the copies in _site; nothing is committed back.
      - name: Stamp dateModified and sitemap lastmod
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "Stamping $TODAY"
          for f in _site/index.html _site/index-zh.html _site/guide.html _site/guide-zh.html; do
            [ -f "$f" ] || continue
            sed -i -E "s/\"dateModified\": \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"/\"dateModified\": \"$TODAY\"/g" "$f"
          done
          if [ -f _site/sitemap.xml ]; then
            sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>$TODAY</lastmod>#g" _site/sitemap.xml
          fi
          echo "--- result ---"
          grep -o '"dateModified": "[^"]*"' _site/index.html _site/index-zh.html || true
          grep -o '<lastmod>[^<]*</lastmod>' _site/sitemap.xml | sort -u || true

      # Fail the build rather than publish an internal file.
      - name: Guard against publishing internal files
        run: |
          set -euo pipefail
          BAD=0
          for f in CLAUDE.md CONTEXT.md README.md schema.sql .gitignore; do
            if [ -e "_site/$f" ]; then echo "REFUSING: _site/$f must not be published"; BAD=1; fi
          done
          if [ -d _site/rules ] || [ -d _site/.claude ]; then
            echo "REFUSING: internal rules directory present in _site"; BAD=1
          fi
          if [ -n "$(find _site -name '*.md' -print -quit)" ]; then
            echo "REFUSING: markdown file present in _site:"; find _site -name '*.md'; BAD=1
          fi
          [ "$BAD" -eq 0 ] && echo "publish directory is clean"
          exit $BAD

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=safeagi-pages --branch=${{ github.ref_name }}
